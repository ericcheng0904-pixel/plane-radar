# Release check: a v* tag builds the tagged commit and runs every check
# scripts/make_release.py would, without signing or publishing anything.
#
# This workflow used to attach a firmware image to a GitHub Release. It no
# longer publishes at all: releases are signed on the maintainer's computer,
# because the signing key must never reach CI, and are served from GitHub Pages
# (docs/RELEASING.md). Its permissions are read-only, so it cannot publish an
# image -- with the airline logos or without -- even by mistake.
name: Release check

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git describe has to find the tag to stamp the version.
          fetch-depth: 0

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build
        run: pio run -e supermini

      - name: Check the build is releasable as this tag
        # Version is the tag and the image was built as it, no logos, fits the
        # slot, release partition layout, real public key embedded.
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            python3 scripts/make_release.py --check-only
          else
            python3 scripts/make_release.py --check-only --version "${GITHUB_REF_NAME}"
          fi
