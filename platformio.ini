; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Two 1.75 MB app slots for over-the-air updates (docs/OTA.md).
board_build.partitions = partitions/plane_radar.csv
; version.py: PLANE_RADAR_VERSION from `git describe`.
; size_guard.py: fails the build if firmware.bin outgrows its app slot.
extra_scripts =
  pre:scripts/version.py
  post:scripts/size_guard.py
  post:scripts/merge_firmware.py

; Anti-aliased VLW fonts (Noto Sans SemiBold), one per UI pixel size.
; Rebuild with: python3 scripts/build_ui_fonts.py
; data/cert/x509_crt_bundle.bin: root certificates for HTTPS, from Mozilla's
; list. Rebuild with: python3 scripts/build_cert_bundle.py
board_build.embed_files =
  data/cert/x509_crt_bundle.bin
  data/ui_font_15.vlw
  data/ui_font_13.vlw
  data/ui_font_11.vlw
  data/ui_font_9.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS
; WM_NOHELP drops WiFiManager's "Available pages" table from /info. It listed
; /u, /restart and /erase, which this firmware answers with 404 — a menu of
; doors that are bricked up.
  -DWM_NOHELP

; Exact versions: a device given away cannot be fixed if a library update
; changes behaviour under it. LovyanGFX 1.2.32 dropped ~0.5 MB of panel and
; touch firmware the C3 build linked in for nothing (1.2.31: 2.44 MB image,
; 1.2.33: 1.91 MB).
lib_deps =
  lovyan03/LovyanGFX@1.2.33
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.4.3

; Stage 2 of the quality pipeline: the portal input parsers build and run on the
; host, so malformed and hostile field values are exercised without a board.
;   pio test -e native
[env:native]
platform = native
test_framework = unity
; pio test links only the test files unless this is set; without it the tests
; compile but cannot find util::coords::parseCoordinate at link time.
test_build_src = yes
; UNITY_INCLUDE_DOUBLE: Unity compiles out its double assertions unless asked,
; and coordinates are doubles — asserting on them as floats would hide exactly
; the precision loss worth catching.
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -I include
  -D UNITY_INCLUDE_DOUBLE
; Only util/ is host-portable; the rest of src/ needs the Arduino core.
build_src_filter = -<*> +<util/>
